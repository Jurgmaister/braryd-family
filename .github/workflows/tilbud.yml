name: Hent ukens tilbud

# Henter tilbud fra matkjedene hver morgen, slik at de er klare når noen åpner appen.
# (Appen henter også selv hvis tilbudene er eldre enn 12 timer.)

on:
  schedule:
    - cron: "41 4 * * *" # hver dag 04:41 UTC (05:41/06:41 norsk tid)
  workflow_dispatch:

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kall funksjonen
        run: |
          set -euo pipefail
          base=$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
          key=$(grep '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          fn=$(grep '^VITE_FUNCTION_NAME=' .env.production | cut -d= -f2- || true)
          fn=${fn:-braryd}
          for i in 1 2 3; do
            if curl -sSf --max-time 140 -X POST "$base/functions/v1/$fn" \
                 -H "Content-Type: application/json" -H "apikey: $key" \
                 -d '{"action":"tilbud-sync"}' -o /tmp/svar.json; then
              cat /tmp/svar.json; exit 0
            fi
            echo "Forsøk $i feilet, prøver igjen om 60 s"; sleep 60
          done
          exit 1
